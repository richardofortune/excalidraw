# Homelab deployment:
#   yarn build:app:docker
#   ./deploy.sh --subdir excalidraw-app/build ~/Documents/github/excalidraw excalidraw
#
# Serves THIS fork, not excalidraw/excalidraw:latest. The upstream Dockerfile
# needs BuildKit cache mounts, which the NAS's classic builder cannot run — but
# Vite output is architecture-independent, so the bundle is built on the laptop
# and served statically here. Rollback to upstream: docker-compose.upstream-image.yml.bak
services:
  excalidraw:
    image: nginx:alpine
    container_name: excalidraw
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.rule=Host(`excalidraw.home.arpa`)"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=80"
    networks:
      - homelab

networks:
  homelab:
    external: true
